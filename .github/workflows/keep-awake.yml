name: Keep AI Ops Platform Awake

on:
  schedule:
    - cron: "0 */4 * * *"   # 每 4 小时（UTC）
  workflow_dispatch:        # 可手动 Run workflow 测试

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app to refresh activity
        run: |
          URL="https://marketplace-ai-5pcdqykzdvcxzqq8deumab.streamlit.app/"
          echo "Pinging $URL"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ] || [ -z "$HTTP_CODE" ]; then
            echo "WARN - connection failed"; exit 1
          else
            echo "OK - server responded ($HTTP_CODE), app activity refreshed."
          fi
